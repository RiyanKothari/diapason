name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -q
      # Whole pipeline, no API keys or credits: fake agent, then reference agent v1 vs v2 with a diff.
      - run: bhool selftest --limit 4
      - run: bhool demo
