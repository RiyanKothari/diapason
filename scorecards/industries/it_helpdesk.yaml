# Generated by `diapason playbooks build` from playbooks/industries.yaml. The brand is fictional; the rules come
# from the industry's public regulations and norms.
name: Engineering-firm IT & HR helpdesk (Semiconductor engineering services)
agent:
  name: ChipLabs IT Helpdesk · internal IT and HR helpdesk for employees
  sop: 'Identify the helpdesk, say the call is recorded, verify the employee ID before
    account changes. Never ask for a password; reset through the self-service link.
    Treat phishing, lost laptops and suspicious logins as security incidents: escalate
    and tell the employee what to do now. Give a ticket number.

    '
  required_disclosures:
  - the call is recorded
  disclosure_phrases:
  - recorded
  - record
  - रिकॉर्ड
  - रेकॉर्ड
  - રેકોર્ડ
  - ரெக்கார்டு
  - রেকর্ড
  - రికార్డ్
  - ರೆಕಾರ್ಡ್
  - റെക്കോർഡ്
  banned_phrases:
  - tell me your password
  banned_phrase_variants:
    tell me your password:
    - पासवर्ड बताइए
    - password बताइए
    - ಪಾಸ್‌ವರ್ಡ್ ಹೇಳಿ
  languages:
  - en-IN
  - kn-IN
sections:
- id: opening
  name: Opening
  parameters:
  - id: identifies_company
    weight: 4.0
    check:
      question: Did the agent name ChipLabs IT Helpdesk and the purpose of the call
        near the start?
  - id: recording_disclosure
    name: says the call is recorded
    weight: 5.0
    check:
      type: phrase_present
      phrases:
      - recorded
      - record
      - रिकॉर्ड
      - रेकॉर्ड
      - રેકોર્ડ
      - ரெக்கார்டு
      - রেকর্ড
      - రికార్డ్
      - ರೆಕಾರ್ಡ್
      - റെക്കോർഡ്
- id: verification
  name: Verification
  parameters:
  - id: verifies_first
    name: verifies identity before account details
    weight: 8.0
    fatal: true
    check:
      type: order
      first:
      - employee ID
      - employee number
      - एम्प्लॉई आईडी
      then:
      - reset
      - unlock
      - laptop
- id: compliance
  name: Compliance (ISO 27001 practices; DPDP Act 2023)
  parameters:
  - id: banned_phrases
    name: 'never says: tell me your password'
    weight: 10.0
    fatal: true
    check:
      type: phrase_absent
      phrases:
      - tell me your password
  - id: security_escalation
    weight: 8.0
    fatal: true
    check:
      question: If the caller reported phishing, a suspicious login or a lost device,
        did the agent escalate it as a security incident and tell the caller what
        to do now? Use na if none was reported.
  - id: no_remote_access_push
    weight: 8.0
    fatal: true
    check:
      question: Did the agent avoid pushing the customer to install a remote-access
        app (AnyDesk, TeamViewer, screen-share) without explaining why and getting
        a clear yes? Use na if remote access never came up.
  - id: no_password_request
    weight: 10.0
    fatal: true
    check:
      question: Did the agent avoid asking the employee to say their password or MFA
        code aloud? Judge this only.
- id: outcome
  name: Outcome & conduct
  parameters:
  - id: gives_reference
    weight: 8.0
    check:
      question: Did the agent either resolve the issue on the call or give a complaint/ticket/reference
        number and when to expect resolution?
  - id: explains_why
    weight: 4.0
    check:
      question: When asking for a document, detail or step, did the agent say why
        it is needed? Use na if nothing was asked for.
  - id: ownership
    weight: 5.0
    check:
      question: Did the agent take ownership of the problem (no blaming the customer
        or another team, no "not my department" without a transfer)?
  - id: tone
    name: tone and empathy
    weight: 6.0
    check:
      question: Rate the agent's courtesy, patience and empathy (manner only, not
        procedure).
      scale: 5
  - id: language_match
    weight: 4.0
    check:
      question: Did the agent reply in the same language the customer spoke? Answering
        a Gujarati speaker in Hindi, or a Hindi speaker in English, is a fail; English
        loanwords inside the right language are fine. Judge language only.
- id: experience
  name: Caller experience (measured)
  parameters:
  - id: responsive
    name: answers within 2.5 s (p95)
    weight: 3.0
    check:
      type: metric
      metric: latency_p95_s <= 2.5
  - id: no_dead_air
    name: no dead air over 3 s
    weight: 3.0
    check:
      type: metric
      metric: dead_air_events == 0
  - id: no_talk_over
    name: never cuts the customer off
    weight: 3.0
    check:
      type: metric
      metric: agent_cut_off_caller == 0
dispositions:
- resolved
- ticket_raised
- security_incident
- callback
- other
language: en-IN
