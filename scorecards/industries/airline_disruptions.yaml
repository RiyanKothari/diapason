# Generated by `diapason playbooks build` from playbooks/industries.yaml. The brand is fictional; the rules come
# from the industry's public regulations and norms.
name: Airline cancellations & refunds (Airline)
agent:
  name: Udaan Air · booking changes, cancellations and refunds
  sop: 'Identify the airline, say the call is recorded, verify with PNR and passenger
    name before booking details. For a cancellation or long delay by the airline,
    offer the choice of a full refund or an alternate flight; a credit shell only
    if the passenger wants it. Read back new flight details. Never take card details
    aloud; use a payment link.

    '
  required_disclosures:
  - the call is recorded
  disclosure_phrases:
  - recorded
  - record
  - रिकॉर्ड
  - रेकॉर्ड
  - રેકોર્ડ
  - ரெக்கார்டு
  - রেকর্ড
  - రికార్డ్
  - ರೆಕಾರ್ಡ್
  - റെക്കോർഡ്
  banned_phrases:
  - tell me the OTP
  - tell me the CVV
  banned_phrase_variants:
    tell me the OTP:
    - ओटीपी बताइए
    - OTP बताइए
    - ओटीपी बता दीजिए
    - OTP બતાવો
    - OTP சொல்லுங்கள்
    - OTP ಹೇಳಿ
    tell me the CVV:
    - CVV बताइए
    - सीवीवी बताइए
  languages:
  - en-IN
  - hi-IN
  - ml-IN
sections:
- id: opening
  name: Opening
  parameters:
  - id: identifies_company
    weight: 4.0
    check:
      question: Did the agent name Udaan Air and the purpose of the call near the
        start?
  - id: recording_disclosure
    name: says the call is recorded
    weight: 5.0
    check:
      type: phrase_present
      phrases:
      - recorded
      - record
      - रिकॉर्ड
      - रेकॉर्ड
      - રેકોર્ડ
      - ரெக்கார்டு
      - রেকর্ড
      - రికార్డ్
      - ರೆಕಾರ್ಡ್
      - റെക്കോർഡ്
- id: verification
  name: Verification
  parameters:
  - id: verifies_first
    name: verifies identity before account details
    weight: 8.0
    fatal: true
    check:
      type: order
      first:
      - PNR
      - पीएनआर
      - booking reference
      - പിഎൻആർ
      then:
      - refund
      - रिफंड
      - റീഫണ്ട്
      - new flight
- id: compliance
  name: Compliance (DGCA CAR Sec 3 Series M Part IV (passenger rights); PCI DSS)
  parameters:
  - id: banned_phrases
    name: 'never says: tell me the OTP, tell me the CVV'
    weight: 10.0
    fatal: true
    check:
      type: phrase_absent
      phrases:
      - tell me the OTP
      - tell me the CVV
  - id: refund_choice
    weight: 10.0
    fatal: true
    check:
      question: For a cancelled or heavily delayed flight, did the agent offer the
        passenger the choice of a full refund or an alternative flight, without forcing
        a credit shell? Use na if no cancellation or major delay came up.
  - id: pci_no_card_readout
    weight: 10.0
    fatal: true
    check:
      question: Did the agent avoid reading out or asking for a full card number or
        CVV on the call (a secure IVR or payment link is fine)? Use na if no card
        payment came up.
- id: outcome
  name: Outcome & conduct
  parameters:
  - id: disruption_details
    weight: 6.0
    check:
      question: When a flight change or disruption was discussed, did the agent give
        the new flight/time (or the refund timeline) clearly and read it back? Use
        na if none came up.
  - id: special_assistance
    weight: 5.0
    check:
      question: If the passenger mentioned a wheelchair, medical need, infant or elderly
        traveller, did the agent note the assistance and confirm it? Use na if none
        was mentioned.
  - id: accurate_information
    weight: 8.0
    check:
      question: Was everything the agent stated about prices, timelines, policies
        and eligibility consistent with the SOP, with nothing invented?
  - id: hold_etiquette
    weight: 4.0
    check:
      question: If the agent put the customer on hold or transferred them, did they
        ask first and say why? Use na if there was no hold or transfer.
  - id: tone
    name: tone and empathy
    weight: 6.0
    check:
      question: Rate the agent's courtesy, patience and empathy (manner only, not
        procedure).
      scale: 5
  - id: language_match
    weight: 4.0
    check:
      question: Did the agent reply in the same language the customer spoke? Answering
        a Gujarati speaker in Hindi, or a Hindi speaker in English, is a fail; English
        loanwords inside the right language are fine. Judge language only.
- id: experience
  name: Caller experience (measured)
  parameters:
  - id: responsive
    name: answers within 2.5 s (p95)
    weight: 3.0
    check:
      type: metric
      metric: latency_p95_s <= 2.5
  - id: no_dead_air
    name: no dead air over 3 s
    weight: 3.0
    check:
      type: metric
      metric: dead_air_events == 0
  - id: no_talk_over
    name: never cuts the customer off
    weight: 3.0
    check:
      type: metric
      metric: agent_cut_off_caller == 0
dispositions:
- rebooked
- refunded
- credit_shell
- assistance_added
- callback
- other
language: en-IN
