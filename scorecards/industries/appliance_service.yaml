# Generated by `diapason playbooks build` from playbooks/industries.yaml. The brand is fictional; the rules come
# from the industry's public regulations and norms.
name: Appliance service & warranty (Consumer electricals)
agent:
  name: Roshni Electricals · service complaints, warranty and technician visits
  sop: 'Identify the brand, say the call is recorded, take the product and purchase
    date, check warranty correctly, book a technician visit and read back the date
    and slot, give the complaint number. Payments only through official links.

    '
  required_disclosures:
  - the call is recorded
  disclosure_phrases:
  - recorded
  - record
  - रिकॉर्ड
  - रेकॉर्ड
  - રેકોર્ડ
  - ரெக்கார்டு
  - রেকর্ড
  - రికార్డ్
  - ರೆಕಾರ್ಡ್
  - റെക്കോർഡ്
  banned_phrases:
  - tell me the OTP
  - tell me the CVV
  banned_phrase_variants:
    tell me the OTP:
    - ओटीपी बताइए
    - OTP बताइए
    - ओटीपी बता दीजिए
    - OTP બતાવો
    - OTP சொல்லுங்கள்
    - OTP ಹೇಳಿ
    tell me the CVV:
    - CVV बताइए
    - सीवीवी बताइए
  languages:
  - hi-IN
  - en-IN
  - bn-IN
sections:
- id: opening
  name: Opening
  parameters:
  - id: identifies_company
    weight: 4.0
    check:
      question: Did the agent name Roshni Electricals and the purpose of the call
        near the start?
  - id: recording_disclosure
    name: says the call is recorded
    weight: 5.0
    check:
      type: phrase_present
      phrases:
      - recorded
      - record
      - रिकॉर्ड
      - रेकॉर्ड
      - રેકોર્ડ
      - ரெக்கார்டு
      - রেকর্ড
      - రికార్డ్
      - ರೆಕಾರ್ಡ್
      - റെക്കോർഡ്
- id: compliance
  name: Compliance (Consumer Protection Act 2019)
  parameters:
  - id: banned_phrases
    name: 'never says: tell me the OTP, tell me the CVV'
    weight: 10.0
    fatal: true
    check:
      type: phrase_absent
      phrases:
      - tell me the OTP
      - tell me the CVV
  - id: no_secret_request
    weight: 10.0
    fatal: true
    check:
      question: Did the agent avoid asking the customer to say an OTP, CVV, PIN, UPI
        PIN, password or full card number aloud, in any wording? Judge this only.
- id: outcome
  name: Outcome & conduct
  parameters:
  - id: gives_reference
    weight: 8.0
    check:
      question: Did the agent either resolve the issue on the call or give a complaint/ticket/reference
        number and when to expect resolution?
  - id: booking_readback
    weight: 6.0
    check:
      question: When a service, test drive, technician visit or appointment was booked,
        did the agent read back the date, time and place? Use na if nothing was booked.
  - id: no_false_warranty
    weight: 6.0
    check:
      question: Did the agent avoid promising free repairs, warranty or recall cover
        without checking eligibility? Use na if repairs or warranty never came up.
  - id: accurate_information
    weight: 8.0
    check:
      question: Was everything the agent stated about prices, timelines, policies
        and eligibility consistent with the SOP, with nothing invented?
  - id: tone
    name: tone and empathy
    weight: 6.0
    check:
      question: Rate the agent's courtesy, patience and empathy (manner only, not
        procedure).
      scale: 5
  - id: language_match
    weight: 4.0
    check:
      question: Did the agent reply in the same language the customer spoke? Answering
        a Gujarati speaker in Hindi, or a Hindi speaker in English, is a fail; English
        loanwords inside the right language are fine. Judge language only.
- id: experience
  name: Caller experience (measured)
  parameters:
  - id: responsive
    name: answers within 2.5 s (p95)
    weight: 3.0
    check:
      type: metric
      metric: latency_p95_s <= 2.5
  - id: no_dead_air
    name: no dead air over 3 s
    weight: 3.0
    check:
      type: metric
      metric: dead_air_events == 0
  - id: no_talk_over
    name: never cuts the customer off
    weight: 3.0
    check:
      type: metric
      metric: agent_cut_off_caller == 0
dispositions:
- technician_booked
- resolved
- out_of_warranty_quote
- callback
- other
