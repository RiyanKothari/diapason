name: Vacation-ownership memberships (Leisure (vacation-ownership memberships))
agent:
  name: Safar Holidays Club · membership upgrades, annual-fee reminders and resort
    bookings
  sop: 'Identify the company, say the call is recorded, verify the member ID. When
    pitching an upgrade, state the full cost including annual subscription fees, no
    claims of guaranteed availability or investment value, explicit yes before payment,
    accept a no. Read back resort booking dates.

    '
  required_disclosures:
  - the call is recorded
  disclosure_phrases:
  - recorded
  - record
  - रिकॉर्ड
  - रेकॉर्ड
  - રેકોર્ડ
  - ரெக்கார்டு
  - রেকর্ড
  - రికార్డ్
  - ರೆಕಾರ್ಡ್
  - റെക്കോർഡ്
  banned_phrases:
  - guaranteed availability
  - investment
  banned_phrase_variants:
    guaranteed availability:
    - गारंटीड अवेलेबिलिटी
    - पक्का रूम
    investment:
    - इन्वेस्टमेंट
  languages:
  - en-IN
  - hi-IN
  - ta-IN
sections:
- id: opening
  name: Opening
  parameters:
  - id: identifies_company
    weight: 4.0
    check:
      question: Did the agent name Safar Holidays Club and the purpose of the call
        near the start?
  - id: recording_disclosure
    name: says the call is recorded
    weight: 5.0
    check:
      type: phrase_present
      phrases:
      - recorded
      - record
      - रिकॉर्ड
      - रेकॉर्ड
      - રેકોર્ડ
      - ரெக்கார்டு
      - রেকর্ড
      - రికార్డ్
      - ರೆಕಾರ್ಡ್
      - റെക്കോർഡ്
- id: verification
  name: Verification
  parameters:
  - id: verifies_first
    name: verifies identity before account details
    weight: 8.0
    fatal: true
    check:
      type: order
      first:
      - member ID
      - membership number
      - मेंबर आईडी
      - मेंबरशिप नंबर
      then:
      - annual fee
      - ASF
      - outstanding
      - बकाया
- id: compliance
  name: Compliance (Consumer Protection Act 2019; CCPA dark-pattern guidelines 2023;
    TRAI TCCCPR 2018)
  parameters:
  - id: banned_phrases
    name: 'never says: guaranteed availability, investment'
    weight: 10.0
    fatal: true
    check:
      type: phrase_absent
      phrases:
      - guaranteed availability
      - investment
  - id: no_false_membership_claims
    weight: 10.0
    fatal: true
    check:
      question: 'Did the agent avoid false or exaggerated claims: assured holiday
        availability, investment returns, guaranteed resale value, or hiding annual
        fees and cancellation terms?'
  - id: explicit_consent
    weight: 10.0
    fatal: true
    check:
      question: Before any purchase, upgrade, payment or activation step, did the
        agent take an explicit yes, not treat a vague answer as consent? Use na if
        no such step happened.
  - id: honours_opt_out
    weight: 8.0
    fatal: true
    check:
      question: If the customer asked not to be called or to stop promotional calls,
        did the agent accept it, confirm it and stop pitching? Use na if they never
        asked.
- id: outcome
  name: Outcome & conduct
  parameters:
  - id: states_full_cost
    weight: 6.0
    check:
      question: When a membership or upgrade was pitched, did the agent state the
        full cost, including annual or maintenance fees? Use na if nothing was pitched.
  - id: booking_readback
    weight: 6.0
    check:
      question: When a service, test drive, technician visit or appointment was booked,
        did the agent read back the date, time and place? Use na if nothing was booked.
  - id: tone
    name: tone and empathy
    weight: 6.0
    check:
      question: Rate the agent's courtesy, patience and empathy (manner only, not
        procedure).
      scale: 5
  - id: language_match
    weight: 4.0
    check:
      question: Did the agent reply in the same language the customer spoke? Answering
        a Gujarati speaker in Hindi, or a Hindi speaker in English, is a fail; English
        loanwords inside the right language are fine. Judge language only.
- id: experience
  name: Caller experience (measured)
  parameters:
  - id: responsive
    name: answers within 2.5 s (p95)
    weight: 3.0
    check:
      type: metric
      metric: latency_p95_s <= 2.5
  - id: no_dead_air
    name: no dead air over 3 s
    weight: 3.0
    check:
      type: metric
      metric: dead_air_events == 0
  - id: no_talk_over
    name: never cuts the customer off
    weight: 3.0
    check:
      type: metric
      metric: agent_cut_off_caller == 0
dispositions:
- upgraded
- booking_made
- fee_paid
- declined
- dnd
- callback
- other
language: en-IN
