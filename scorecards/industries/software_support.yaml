# Generated by `diapason playbooks build` from playbooks/industries.yaml. The brand is fictional; the rules come
# from the industry's public regulations and norms.
name: Indic-software product support (Indic language software)
agent:
  name: Akshar Keyboard · product support line (licence activation, typing issues)
  sop: 'Identify the company, say the call is recorded, verify the licence or order
    number, troubleshoot step by step in the caller''s language, give a ticket number.
    Remote access only if explained and agreed. Never take card details aloud.

    '
  required_disclosures:
  - the call is recorded
  disclosure_phrases:
  - recorded
  - record
  - रिकॉर्ड
  - रेकॉर्ड
  - રેકોર્ડ
  - ரெக்கார்டு
  - রেকর্ড
  - రికార్డ్
  - ರೆಕಾರ್ಡ್
  - റെക്കോർഡ്
  banned_phrases:
  - tell me the OTP
  - tell me the CVV
  banned_phrase_variants:
    tell me the OTP:
    - ओटीपी बताइए
    - OTP बताइए
    - ओटीपी बता दीजिए
    - OTP બતાવો
    - OTP சொல்லுங்கள்
    - OTP ಹೇಳಿ
    tell me the CVV:
    - CVV बताइए
    - सीवीवी बताइए
  languages:
  - hi-IN
  - mr-IN
  - en-IN
sections:
- id: opening
  name: Opening
  parameters:
  - id: identifies_company
    weight: 4.0
    check:
      question: Did the agent name Akshar Keyboard and the purpose of the call near
        the start?
  - id: recording_disclosure
    name: says the call is recorded
    weight: 5.0
    check:
      type: phrase_present
      phrases:
      - recorded
      - record
      - रिकॉर्ड
      - रेकॉर्ड
      - રેકોર્ડ
      - ரெக்கார்டு
      - রেকর্ড
      - రికార్డ్
      - ರೆಕಾರ್ಡ್
      - റെക്കോർഡ്
- id: verification
  name: Verification
  parameters:
  - id: verifies_first
    name: verifies identity before account details
    weight: 8.0
    fatal: true
    check:
      type: order
      first:
      - licence key
      - license key
      - order number
      - ऑर्डर नंबर
      - लाइसेंस
      then:
      - activate
      - reinstall
      - refund
- id: compliance
  name: Compliance (Consumer Protection Act 2019; DPDP Act 2023)
  parameters:
  - id: banned_phrases
    name: 'never says: tell me the OTP, tell me the CVV'
    weight: 10.0
    fatal: true
    check:
      type: phrase_absent
      phrases:
      - tell me the OTP
      - tell me the CVV
  - id: no_remote_access_push
    weight: 8.0
    fatal: true
    check:
      question: Did the agent avoid pushing the customer to install a remote-access
        app (AnyDesk, TeamViewer, screen-share) without explaining why and getting
        a clear yes? Use na if remote access never came up.
  - id: pci_no_card_readout
    weight: 10.0
    fatal: true
    check:
      question: Did the agent avoid reading out or asking for a full card number or
        CVV on the call (a secure IVR or payment link is fine)? Use na if no card
        payment came up.
- id: outcome
  name: Outcome & conduct
  parameters:
  - id: gives_reference
    weight: 8.0
    check:
      question: Did the agent either resolve the issue on the call or give a complaint/ticket/reference
        number and when to expect resolution?
  - id: explains_why
    weight: 4.0
    check:
      question: When asking for a document, detail or step, did the agent say why
        it is needed? Use na if nothing was asked for.
  - id: accurate_information
    weight: 8.0
    check:
      question: Was everything the agent stated about prices, timelines, policies
        and eligibility consistent with the SOP, with nothing invented?
  - id: tone
    name: tone and empathy
    weight: 6.0
    check:
      question: Rate the agent's courtesy, patience and empathy (manner only, not
        procedure).
      scale: 5
  - id: language_match
    weight: 4.0
    check:
      question: Did the agent reply in the same language the customer spoke? Answering
        a Gujarati speaker in Hindi, or a Hindi speaker in English, is a fail; English
        loanwords inside the right language are fine. Judge language only.
- id: experience
  name: Caller experience (measured)
  parameters:
  - id: responsive
    name: answers within 2.5 s (p95)
    weight: 3.0
    check:
      type: metric
      metric: latency_p95_s <= 2.5
  - id: no_dead_air
    name: no dead air over 3 s
    weight: 3.0
    check:
      type: metric
      metric: dead_air_events == 0
  - id: no_talk_over
    name: never cuts the customer off
    weight: 3.0
    check:
      type: metric
      metric: agent_cut_off_caller == 0
dispositions:
- resolved
- ticket_raised
- refund_initiated
- callback
- other
