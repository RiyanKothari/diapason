# Generated by `bhool playbooks build` from playbooks/industries.yaml. The brand is fictional; the rules come
# from the industry's public regulations and norms.
name: Bank customer service & card block (Public-sector bank)
agent:
  name: Rashtriya Bank · customer service line (account, card block, branch services)
  sop: 'Identify the bank, say the call is recorded, verify with registered mobile
    and date of birth before account details. Block a lost or compromised card immediately
    and give a reference number. Never ask for OTP, CVV, PIN or password. Explain
    that reporting fraud within 3 days limits liability.

    '
  required_disclosures:
  - the call is recorded
  disclosure_phrases:
  - recorded
  - record
  - रिकॉर्ड
  - रेकॉर्ड
  - રેકોર્ડ
  - ரெக்கார்டு
  - রেকর্ড
  - రికార్డ్
  - ರೆಕಾರ್ಡ್
  - റെക്കോർഡ്
  banned_phrases:
  - tell me the OTP
  - tell me the CVV
  banned_phrase_variants:
    tell me the OTP:
    - ओटीपी बताइए
    - OTP बताइए
    - ओटीपी बता दीजिए
    - OTP બતાવો
    - OTP சொல்லுங்கள்
    - OTP ಹೇಳಿ
    tell me the CVV:
    - CVV बताइए
    - सीवीवी बताइए
  languages:
  - ta-IN
  - en-IN
  - hi-IN
sections:
- id: opening
  name: Opening
  parameters:
  - id: identifies_company
    weight: 4.0
    check:
      question: Did the agent name Rashtriya Bank and the purpose of the call near
        the start?
  - id: recording_disclosure
    name: says the call is recorded
    weight: 5.0
    check:
      type: phrase_present
      phrases:
      - recorded
      - record
      - रिकॉर्ड
      - रेकॉर्ड
      - રેકોર્ડ
      - ரெக்கார்டு
      - রেকর্ড
      - రికార్డ్
      - ರೆಕಾರ್ಡ್
      - റെക്കോർഡ്
- id: verification
  name: Verification
  parameters:
  - id: verifies_first
    name: verifies identity before account details
    weight: 8.0
    fatal: true
    check:
      type: order
      first:
      - registered mobile
      - date of birth
      - जन्म तिथि
      - பிறந்த தேதி
      - रजिस्टर्ड मोबाइल
      then:
      - balance
      - बैलेंस
      - transaction
      - ட்ரான்ஸாக்ஷன்
      - பேலன்ஸ்
- id: compliance
  name: Compliance (RBI customer-liability circular 2017; RBI Charter of Customer
    Rights)
  parameters:
  - id: banned_phrases
    name: 'never says: tell me the OTP, tell me the CVV'
    weight: 10.0
    fatal: true
    check:
      type: phrase_absent
      phrases:
      - tell me the OTP
      - tell me the CVV
  - id: no_secret_request
    weight: 10.0
    fatal: true
    check:
      question: Did the agent avoid asking the customer to say an OTP, CVV, PIN, UPI
        PIN, password or full card number aloud, in any wording? Judge this only.
  - id: security_escalation
    weight: 8.0
    fatal: true
    check:
      question: If the caller reported phishing, a suspicious login or a lost device,
        did the agent escalate it as a security incident and tell the caller what
        to do now? Use na if none was reported.
  - id: blocks_immediately
    weight: 10.0
    fatal: true
    check:
      question: When the customer reported a lost card or fraud, did the agent block
        the card (or confirm it is blocked) before anything else? Use na if neither
        was reported.
- id: outcome
  name: Outcome & conduct
  parameters:
  - id: gives_reference
    weight: 8.0
    check:
      question: Did the agent either resolve the issue on the call or give a complaint/ticket/reference
        number and when to expect resolution?
  - id: accurate_information
    weight: 8.0
    check:
      question: Was everything the agent stated about prices, timelines, policies
        and eligibility consistent with the SOP, with nothing invented?
  - id: hold_etiquette
    weight: 4.0
    check:
      question: If the agent put the customer on hold or transferred them, did they
        ask first and say why? Use na if there was no hold or transfer.
  - id: ownership
    weight: 5.0
    check:
      question: Did the agent take ownership of the problem (no blaming the customer
        or another team, no "not my department" without a transfer)?
  - id: tone
    name: tone and empathy
    weight: 6.0
    check:
      question: Rate the agent's courtesy, patience and empathy (manner only, not
        procedure).
      scale: 5
  - id: language_match
    weight: 4.0
    check:
      question: Did the agent reply in the same language the customer spoke? Answering
        a Gujarati speaker in Hindi, or a Hindi speaker in English, is a fail; English
        loanwords inside the right language are fine. Judge language only.
- id: experience
  name: Caller experience (measured)
  parameters:
  - id: responsive
    name: answers within 2.5 s (p95)
    weight: 3.0
    check:
      type: metric
      metric: latency_p95_s <= 2.5
  - id: no_dead_air
    name: no dead air over 3 s
    weight: 3.0
    check:
      type: metric
      metric: dead_air_events == 0
  - id: no_talk_over
    name: never cuts the customer off
    weight: 3.0
    check:
      type: metric
      metric: agent_cut_off_caller == 0
dispositions:
- resolved
- card_blocked
- complaint_registered
- branch_referral
- callback
- other
language: ta-IN
