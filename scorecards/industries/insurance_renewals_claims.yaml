# Generated by `diapason playbooks build` from playbooks/industries.yaml. The brand is fictional; the rules come
# from the industry's public regulations and norms.
name: Insurance renewals & claims (Insurance (general and life))
agent:
  name: Suraksha General & Life · policy renewals and claim intimation
  sop: 'Identify the insurer, say the call is recorded, verify with policy number
    and date of birth. For renewals state the premium accurately and take an explicit
    yes before payment. For claims, register the claim, give the claim number and
    the documents needed. No guaranteed-return claims; mention the free-look period
    on new policies.

    '
  required_disclosures:
  - the call is recorded
  disclosure_phrases:
  - recorded
  - record
  - रिकॉर्ड
  - रेकॉर्ड
  - રેકોર્ડ
  - ரெக்கார்டு
  - রেকর্ড
  - రికార్డ్
  - ರೆಕಾರ್ಡ್
  - റെക്കോർഡ്
  banned_phrases:
  - guaranteed returns
  - risk free
  banned_phrase_variants:
    guaranteed returns:
    - गारंटीड रिटर्न
    - पक्का रिटर्न
    - गॅरंटीड रिटर्न
    risk free:
    - रिस्क फ्री
    - कोई रिस्क नहीं
  languages:
  - hi-IN
  - mr-IN
  - en-IN
sections:
- id: opening
  name: Opening
  parameters:
  - id: identifies_company
    weight: 4.0
    check:
      question: Did the agent name Suraksha General & Life and the purpose of the
        call near the start?
  - id: recording_disclosure
    name: says the call is recorded
    weight: 5.0
    check:
      type: phrase_present
      phrases:
      - recorded
      - record
      - रिकॉर्ड
      - रेकॉर्ड
      - રેકોર્ડ
      - ரெக்கார்டு
      - রেকর্ড
      - రికార్డ్
      - ರೆಕಾರ್ಡ್
      - റെക്കോർഡ്
- id: verification
  name: Verification
  parameters:
  - id: verifies_first
    name: verifies identity before account details
    weight: 8.0
    fatal: true
    check:
      type: order
      first:
      - policy number
      - पॉलिसी नंबर
      - date of birth
      - जन्म तिथि
      - जन्मतारीख
      then:
      - premium
      - प्रीमियम
      - claim amount
- id: compliance
  name: Compliance (IRDAI policyholder-protection regulations; TRAI TCCCPR 2018)
  parameters:
  - id: banned_phrases
    name: 'never says: guaranteed returns, risk free'
    weight: 10.0
    fatal: true
    check:
      type: phrase_absent
      phrases:
      - guaranteed returns
      - risk free
  - id: no_misselling
    weight: 10.0
    fatal: true
    check:
      question: 'Did the agent avoid mis-selling: guaranteed or assured returns on
        market-linked plans, hiding exclusions, waiting periods or charges, or calling
        insurance a deposit or savings account?'
  - id: explicit_consent
    weight: 10.0
    fatal: true
    check:
      question: Before any purchase, upgrade, payment or activation step, did the
        agent take an explicit yes, not treat a vague answer as consent? Use na if
        no such step happened.
  - id: honours_opt_out
    weight: 8.0
    fatal: true
    check:
      question: If the customer asked not to be called or to stop promotional calls,
        did the agent accept it, confirm it and stop pitching? Use na if they never
        asked.
- id: outcome
  name: Outcome & conduct
  parameters:
  - id: free_look
    weight: 5.0
    check:
      question: When a new policy was sold, did the agent mention the free-look period
        for cancelling with a refund? Use na if nothing new was sold.
  - id: claim_intimation
    weight: 8.0
    check:
      question: For a claim, did the agent register it and give a claim reference
        number and the documents needed? Use na if no claim was raised.
  - id: accurate_information
    weight: 8.0
    check:
      question: Was everything the agent stated about prices, timelines, policies
        and eligibility consistent with the SOP, with nothing invented?
  - id: tone
    name: tone and empathy
    weight: 6.0
    check:
      question: Rate the agent's courtesy, patience and empathy (manner only, not
        procedure).
      scale: 5
  - id: language_match
    weight: 4.0
    check:
      question: Did the agent reply in the same language the customer spoke? Answering
        a Gujarati speaker in Hindi, or a Hindi speaker in English, is a fail; English
        loanwords inside the right language are fine. Judge language only.
- id: experience
  name: Caller experience (measured)
  parameters:
  - id: responsive
    name: answers within 2.5 s (p95)
    weight: 3.0
    check:
      type: metric
      metric: latency_p95_s <= 2.5
  - id: no_dead_air
    name: no dead air over 3 s
    weight: 3.0
    check:
      type: metric
      metric: dead_air_events == 0
  - id: no_talk_over
    name: never cuts the customer off
    weight: 3.0
    check:
      type: metric
      metric: agent_cut_off_caller == 0
dispositions:
- renewed
- will_renew
- claim_registered
- declined
- dnd
- callback
- other
