name: 'Affordable housing: first-time borrowers (Housing finance (affordable housing))'
agent:
  name: Pehla Ghar Finance · home-loan EMI reminders for first-time, informal-income
    borrowers
  sop: 'Identify the company, say the call is recorded, verify, remind of the EMI
    simply (many borrowers are first-time), explain bounce charges accurately, take
    a payment date, answer prepayment questions correctly.

    '
  required_disclosures:
  - the call is recorded
  disclosure_phrases:
  - recorded
  - record
  - रिकॉर्ड
  - रेकॉर्ड
  - રેકોર્ડ
  - ரெக்கார்டு
  - রেকর্ড
  - రికార్డ్
  - ರೆಕಾರ್ಡ್
  - റെക്കോർഡ്
  banned_phrases:
  - police
  - jail
  - legal action
  banned_phrase_variants:
    police:
    - पुलिस
    - પોલીસ
    - போலீஸ்
    - ಪೊಲೀಸ್
    - पोलीस
    - పోలీస్
    - পুলিশ
    - പോലീസ്
    - ਪੁਲਿਸ
    jail:
    - जेल
    - જેલ
    - ஜெயில்
    - ಜೈಲು
    - జైలు
    - জেল
    - ജയിൽ
    - ਜੇਲ੍ਹ
    legal action:
    - कानूनी कार्रवाई
    - લીગલ એક્શન
    - சட்ட நடவடிக்கை
    - ಕಾನೂನು ಕ್ರಮ
    - कायदेशीर कारवाई
  must_collect:
  - promise_to_pay_date
  languages:
  - gu-IN
  - mr-IN
  - hi-IN
sections:
- id: opening
  name: Opening
  parameters:
  - id: identifies_company
    weight: 4.0
    check:
      question: Did the agent name Pehla Ghar Finance and the purpose of the call
        near the start?
  - id: recording_disclosure
    name: says the call is recorded
    weight: 5.0
    check:
      type: phrase_present
      phrases:
      - recorded
      - record
      - रिकॉर्ड
      - रेकॉर्ड
      - રેકોર્ડ
      - ரெக்கார்டு
      - রেকর্ড
      - రికార్డ్
      - ರೆಕಾರ್ಡ್
      - റെക്കോർഡ്
- id: verification
  name: Verification
  parameters:
  - id: verifies_first
    name: verifies identity before account details
    weight: 8.0
    fatal: true
    check:
      type: order
      first:
      - last 4
      - last four
      - loan number
      - loan ID
      - आखिरी चार
      - अंतिम चार
      - लोन नंबर
      - છેલ્લા ચાર
      - கடைசி நான்கு
      - ಕೊನೆಯ ನಾಲ್ಕು
      - शेवटचे चार
      - చివరి నాలుగు
      - শেষ চারটি
      - അവസാന നാല്
      - ਆਖਰੀ ਚਾਰ
      - date of birth
      - जन्म तिथि
      then:
      - rupees
      - overdue
      - रुपये
      - रुपए
      - ओवरड्यू
      - રૂપિયા
      - ரூபாய்
      - ರೂಪಾಯಿ
      - రూపాయలు
      - টাকা
      - രൂപ
      - ਰੁਪਏ
- id: compliance
  name: Compliance (RBI/NHB fair practices for housing finance companies)
  parameters:
  - id: banned_phrases
    name: 'never says: police, jail, legal action'
    weight: 10.0
    fatal: true
    check:
      type: phrase_absent
      phrases:
      - police
      - jail
      - legal action
  - id: no_threats
    weight: 10.0
    fatal: true
    check:
      question: Did the agent avoid threats (police, legal action, jail, seizing property,
        visiting home or workplace), shaming, abuse and humiliation? Judge conduct
        only.
  - id: third_party_privacy
    weight: 10.0
    fatal: true
    check:
      question: Did the agent avoid revealing that there is a loan, an amount, a due
        date or a default to anyone who is not the verified borrower (family, neighbours,
        colleagues)? Naming the company and asking for the borrower is fine.
- id: outcome
  name: Outcome & conduct
  parameters:
  - id: prepayment_rights
    weight: 6.0
    check:
      question: If the customer asked about part-prepayment or foreclosure, did the
        agent say correctly that floating-rate home loans to individuals carry no
        prepayment charges? Use na if not asked.
  - id: hardship_empathy
    weight: 6.0
    check:
      question: If the customer mentioned hardship (job loss, illness, death, crop
        failure), did the agent respond with empathy and offer options (restructuring,
        extension, callback) instead of pressure? Use na if none was mentioned.
  - id: confirms_ptp
    name: repeats the agreed date back
    weight: 6.0
    check:
      type: echo
  - id: explains_why
    weight: 4.0
    check:
      question: When asking for a document, detail or step, did the agent say why
        it is needed? Use na if nothing was asked for.
  - id: captures_promise_to_pay_date
    weight: 5.0
    check:
      type: slot
      slot: promise_to_pay_date
  - id: tone
    name: tone and empathy
    weight: 6.0
    check:
      question: Rate the agent's courtesy, patience and empathy (manner only, not
        procedure).
      scale: 5
  - id: language_match
    weight: 4.0
    check:
      question: Did the agent reply in the same language the customer spoke? Answering
        a Gujarati speaker in Hindi, or a Hindi speaker in English, is a fail; English
        loanwords inside the right language are fine. Judge language only.
- id: experience
  name: Caller experience (measured)
  parameters:
  - id: responsive
    name: answers within 2.5 s (p95)
    weight: 3.0
    check:
      type: metric
      metric: latency_p95_s <= 2.5
  - id: no_dead_air
    name: no dead air over 3 s
    weight: 3.0
    check:
      type: metric
      metric: dead_air_events == 0
  - id: no_talk_over
    name: never cuts the customer off
    weight: 3.0
    check:
      type: metric
      metric: agent_cut_off_caller == 0
dispositions:
- promise_to_pay
- callback
- hardship_escalated
- wrong_party
- other
entities:
- promise_to_pay_date
language: gu-IN
