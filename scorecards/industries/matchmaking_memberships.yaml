# Generated by `diapason playbooks build` from playbooks/industries.yaml. The brand is fictional; the rules come
# from the industry's public regulations and norms.
name: Matchmaking memberships (Consumer internet (matchmaking))
agent:
  name: SaathSaath Matchmaking · membership renewals and upgrades
  sop: 'Identify the brand, say the call is recorded, verify the member. Pitch upgrades
    honestly: no guaranteed match, full price and validity, explicit yes before payment,
    accept a no and DND requests. Never share another member''s contact details.

    '
  required_disclosures:
  - the call is recorded
  disclosure_phrases:
  - recorded
  - record
  - रिकॉर्ड
  - रेकॉर्ड
  - રેકોર્ડ
  - ரெக்கார்டு
  - রেকর্ড
  - రికార్డ్
  - ರೆಕಾರ್ಡ್
  - റെക്കോർഡ്
  banned_phrases:
  - guaranteed match
  banned_phrase_variants:
    guaranteed match:
    - गारंटीड मैच
    - पक्का रिश्ता
    - உறுதியான வரன்
  languages:
  - ta-IN
  - te-IN
  - hi-IN
  - en-IN
sections:
- id: opening
  name: Opening
  parameters:
  - id: identifies_company
    weight: 4.0
    check:
      question: Did the agent name SaathSaath Matchmaking and the purpose of the call
        near the start?
  - id: recording_disclosure
    name: says the call is recorded
    weight: 5.0
    check:
      type: phrase_present
      phrases:
      - recorded
      - record
      - रिकॉर्ड
      - रेकॉर्ड
      - રેકોર્ડ
      - ரெக்கார்டு
      - রেকর্ড
      - రికార్డ్
      - ರೆಕಾರ್ಡ್
      - റെക്കോർഡ്
- id: compliance
  name: Compliance (Consumer Protection Act 2019; TRAI TCCCPR 2018; DPDP Act 2023)
  parameters:
  - id: banned_phrases
    name: 'never says: guaranteed match'
    weight: 10.0
    fatal: true
    check:
      type: phrase_absent
      phrases:
      - guaranteed match
  - id: member_privacy
    weight: 10.0
    fatal: true
    check:
      question: Did the agent avoid sharing another member's or customer's phone number,
        address or private details without their consent? Use na if no one else's
        details came up.
  - id: no_guarantee_claims
    weight: 8.0
    fatal: true
    check:
      question: Did the agent avoid promising guaranteed outcomes (a guaranteed match,
        approval, or result) to sell an upgrade or service?
  - id: explicit_consent
    weight: 10.0
    fatal: true
    check:
      question: Before any purchase, upgrade, payment or activation step, did the
        agent take an explicit yes, not treat a vague answer as consent? Use na if
        no such step happened.
  - id: honours_opt_out
    weight: 8.0
    fatal: true
    check:
      question: If the customer asked not to be called or to stop promotional calls,
        did the agent accept it, confirm it and stop pitching? Use na if they never
        asked.
- id: outcome
  name: Outcome & conduct
  parameters:
  - id: accurate_information
    weight: 8.0
    check:
      question: Was everything the agent stated about prices, timelines, policies
        and eligibility consistent with the SOP, with nothing invented?
  - id: tone
    name: tone and empathy
    weight: 6.0
    check:
      question: Rate the agent's courtesy, patience and empathy (manner only, not
        procedure).
      scale: 5
  - id: language_match
    weight: 4.0
    check:
      question: Did the agent reply in the same language the customer spoke? Answering
        a Gujarati speaker in Hindi, or a Hindi speaker in English, is a fail; English
        loanwords inside the right language are fine. Judge language only.
- id: experience
  name: Caller experience (measured)
  parameters:
  - id: responsive
    name: answers within 2.5 s (p95)
    weight: 3.0
    check:
      type: metric
      metric: latency_p95_s <= 2.5
  - id: no_dead_air
    name: no dead air over 3 s
    weight: 3.0
    check:
      type: metric
      metric: dead_air_events == 0
  - id: no_talk_over
    name: never cuts the customer off
    weight: 3.0
    check:
      type: metric
      metric: agent_cut_off_caller == 0
dispositions:
- renewed
- upgraded
- declined
- dnd
- callback
- other
language: ta-IN
