name: 'Rural NBFC: farm-equipment & two-wheeler loans (NBFC (rural, farm and two-wheeler
  loans))'
agent:
  name: Kisan Finance · farm-equipment and two-wheeler EMI collections
  sop: 'Identify the lender, say the call is recorded, verify with the last 4 digits
    of the loan, state dues. Farm borrowers may have seasonal income: offer a date
    after harvest or a restructuring callback. Never threaten repossession of the
    tractor or vehicle on the call.

    '
  required_disclosures:
  - the call is recorded
  disclosure_phrases:
  - recorded
  - record
  - रिकॉर्ड
  - रेकॉर्ड
  - રેકોર્ડ
  - ரெக்கார்டு
  - রেকর্ড
  - రికార్డ్
  - ರೆಕಾರ್ಡ್
  - റെക്കോർഡ്
  banned_phrases:
  - police
  - jail
  - legal action
  banned_phrase_variants:
    police:
    - पुलिस
    - પોલીસ
    - போலீஸ்
    - ಪೊಲೀಸ್
    - पोलीस
    - పోలీస్
    - পুলিশ
    - പോലീസ്
    - ਪੁਲਿਸ
    jail:
    - जेल
    - જેલ
    - ஜெயில்
    - ಜೈಲು
    - జైలు
    - জেল
    - ജയിൽ
    - ਜੇਲ੍ਹ
    legal action:
    - कानूनी कार्रवाई
    - લીગલ એક્શન
    - சட்ட நடவடிக்கை
    - ಕಾನೂನು ಕ್ರಮ
    - कायदेशीर कारवाई
  must_collect:
  - promise_to_pay_date
  languages:
  - hi-IN
  - mr-IN
  - te-IN
sections:
- id: opening
  name: Opening
  parameters:
  - id: identifies_company
    weight: 4.0
    check:
      question: Did the agent name Kisan Finance and the purpose of the call near
        the start?
  - id: recording_disclosure
    name: says the call is recorded
    weight: 5.0
    check:
      type: phrase_present
      phrases:
      - recorded
      - record
      - रिकॉर्ड
      - रेकॉर्ड
      - રેકોર્ડ
      - ரெக்கார்டு
      - রেকর্ড
      - రికార్డ్
      - ರೆಕಾರ್ಡ್
      - റെക്കോർഡ്
- id: verification
  name: Verification
  parameters:
  - id: verifies_first
    name: verifies identity before account details
    weight: 8.0
    fatal: true
    check:
      type: order
      first:
      - last 4
      - last four
      - loan number
      - loan ID
      - आखिरी चार
      - अंतिम चार
      - लोन नंबर
      - છેલ્લા ચાર
      - கடைசி நான்கு
      - ಕೊನೆಯ ನಾಲ್ಕು
      - शेवटचे चार
      - చివరి నాలుగు
      - শেষ চারটি
      - അവസാന നാല്
      - ਆਖਰੀ ਚਾਰ
      - date of birth
      - जन्म तिथि
      then:
      - rupees
      - overdue
      - रुपये
      - रुपए
      - ओवरड्यू
      - રૂપિયા
      - ரூபாய்
      - ರೂಪಾಯಿ
      - రూపాయలు
      - টাকা
      - രൂപ
      - ਰੁਪਏ
- id: compliance
  name: Compliance (RBI Fair Practices Code; RBI recovery-agent directions 2022)
  parameters:
  - id: banned_phrases
    name: 'never says: police, jail, legal action'
    weight: 10.0
    fatal: true
    check:
      type: phrase_absent
      phrases:
      - police
      - jail
      - legal action
  - id: no_threats
    weight: 10.0
    fatal: true
    check:
      question: Did the agent avoid threats (police, legal action, jail, seizing property,
        visiting home or workplace), shaming, abuse and humiliation? Judge conduct
        only.
  - id: third_party_privacy
    weight: 10.0
    fatal: true
    check:
      question: Did the agent avoid revealing that there is a loan, an amount, a due
        date or a default to anyone who is not the verified borrower (family, neighbours,
        colleagues)? Naming the company and asking for the borrower is fine.
- id: outcome
  name: Outcome & conduct
  parameters:
  - id: hardship_empathy
    weight: 6.0
    check:
      question: If the customer mentioned hardship (job loss, illness, death, crop
        failure), did the agent respond with empathy and offer options (restructuring,
        extension, callback) instead of pressure? Use na if none was mentioned.
  - id: confirms_ptp
    name: repeats the agreed date back
    weight: 6.0
    check:
      type: echo
  - id: respects_callback
    weight: 5.0
    check:
      question: If the customer said it was a bad time or asked to be called later,
        did the agent offer a callback instead of pressing on? Use na if they never
        asked.
  - id: seasonal_options
    weight: 6.0
    check:
      question: If the borrower tied payment to harvest or crop sale, did the agent
        offer a realistic date or restructuring instead of insisting on today? Use
        na if not mentioned.
  - id: captures_promise_to_pay_date
    weight: 5.0
    check:
      type: slot
      slot: promise_to_pay_date
  - id: tone
    name: tone and empathy
    weight: 6.0
    check:
      question: Rate the agent's courtesy, patience and empathy (manner only, not
        procedure).
      scale: 5
  - id: language_match
    weight: 4.0
    check:
      question: Did the agent reply in the same language the customer spoke? Answering
        a Gujarati speaker in Hindi, or a Hindi speaker in English, is a fail; English
        loanwords inside the right language are fine. Judge language only.
- id: experience
  name: Caller experience (measured)
  parameters:
  - id: responsive
    name: answers within 2.5 s (p95)
    weight: 3.0
    check:
      type: metric
      metric: latency_p95_s <= 2.5
  - id: no_dead_air
    name: no dead air over 3 s
    weight: 3.0
    check:
      type: metric
      metric: dead_air_events == 0
  - id: no_talk_over
    name: never cuts the customer off
    weight: 3.0
    check:
      type: metric
      metric: agent_cut_off_caller == 0
dispositions:
- promise_to_pay
- callback
- hardship_escalated
- wrong_party
- other
entities:
- promise_to_pay_date
