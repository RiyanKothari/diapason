# Generated by `bhool playbooks build` from playbooks/industries.yaml. The brand is fictional; the rules come
# from the industry's public regulations and norms.
name: Digital personal loans & top-ups (Digital lending (salaried personal loans))
agent:
  name: Turant Loans · EMI reminders and top-up offers
  sop: 'Say which regulated lender the loan is with and that the call is recorded.
    Verify, remind of the EMI, take a date. If offering a top-up, state the APR, point
    to the Key Fact Statement and the cooling-off period. Never threaten to contact
    the customer''s phone contacts or employer.

    '
  required_disclosures:
  - the call is recorded
  disclosure_phrases:
  - recorded
  - record
  - रिकॉर्ड
  - रेकॉर्ड
  - રેકોર્ડ
  - ரெக்கார்டு
  - রেকর্ড
  - రికార్డ్
  - ರೆಕಾರ್ಡ್
  - റെക്കോർഡ്
  banned_phrases:
  - police
  - jail
  - legal action
  banned_phrase_variants:
    police:
    - पुलिस
    - પોલીસ
    - போலீஸ்
    - ಪೊಲೀಸ್
    - पोलीस
    - పోలీస్
    - পুলিশ
    - പോലീസ്
    - ਪੁਲਿਸ
    jail:
    - जेल
    - જેલ
    - ஜெயில்
    - ಜೈಲು
    - జైలు
    - জেল
    - ജയിൽ
    - ਜੇਲ੍ਹ
    legal action:
    - कानूनी कार्रवाई
    - લીગલ એક્શન
    - சட்ட நடவடிக்கை
    - ಕಾನೂನು ಕ್ರಮ
    - कायदेशीर कारवाई
  must_collect:
  - promise_to_pay_date
  languages:
  - en-IN
  - hi-IN
sections:
- id: opening
  name: Opening
  parameters:
  - id: identifies_company
    weight: 4.0
    check:
      question: Did the agent name Turant Loans and the purpose of the call near the
        start?
  - id: recording_disclosure
    name: says the call is recorded
    weight: 5.0
    check:
      type: phrase_present
      phrases:
      - recorded
      - record
      - रिकॉर्ड
      - रेकॉर्ड
      - રેકોર્ડ
      - ரெக்கார்டு
      - রেকর্ড
      - రికార్డ్
      - ರೆಕಾರ್ಡ್
      - റെക്കോർഡ്
- id: verification
  name: Verification
  parameters:
  - id: verifies_first
    name: verifies identity before account details
    weight: 8.0
    fatal: true
    check:
      type: order
      first:
      - last 4
      - last four
      - loan number
      - loan ID
      - आखिरी चार
      - अंतिम चार
      - लोन नंबर
      - છેલ્લા ચાર
      - கடைசி நான்கு
      - ಕೊನೆಯ ನಾಲ್ಕು
      - शेवटचे चार
      - చివరి నాలుగు
      - শেষ চারটি
      - അവസാന നാല്
      - ਆਖਰੀ ਚਾਰ
      - date of birth
      - जन्म तिथि
      then:
      - rupees
      - overdue
      - रुपये
      - रुपए
      - ओवरड्यू
      - રૂપિયા
      - ரூபாய்
      - ರೂಪಾಯಿ
      - రూపాయలు
      - টাকা
      - രൂപ
      - ਰੁਪਏ
- id: compliance
  name: Compliance (RBI Digital Lending Guidelines 2022; RBI Fair Practices Code)
  parameters:
  - id: banned_phrases
    name: 'never says: police, jail, legal action'
    weight: 10.0
    fatal: true
    check:
      type: phrase_absent
      phrases:
      - police
      - jail
      - legal action
  - id: no_contacts_threat
    weight: 10.0
    fatal: true
    check:
      question: Did the agent avoid threatening to call, message or shame the borrower
        before their phone contacts, friends, family or employer? Judge this only.
  - id: no_threats
    weight: 10.0
    fatal: true
    check:
      question: Did the agent avoid threats (police, legal action, jail, seizing property,
        visiting home or workplace), shaming, abuse and humiliation? Judge conduct
        only.
  - id: explicit_consent
    weight: 10.0
    fatal: true
    check:
      question: Before any purchase, upgrade, payment or activation step, did the
        agent take an explicit yes, not treat a vague answer as consent? Use na if
        no such step happened.
- id: outcome
  name: Outcome & conduct
  parameters:
  - id: names_lender_and_agency
    weight: 5.0
    check:
      question: Did the agent say which regulated lender the loan is with (and, if
        calling for a recovery agency, the agency's name)?
  - id: kfs_on_offer
    weight: 6.0
    check:
      question: When a new loan, top-up or credit-limit increase was offered, did
        the agent state the all-in annual cost (APR) or point to the Key Fact Statement,
        and mention the cooling-off period? Use na if nothing was offered.
  - id: confirms_ptp
    name: repeats the agreed date back
    weight: 6.0
    check:
      type: echo
  - id: captures_promise_to_pay_date
    weight: 5.0
    check:
      type: slot
      slot: promise_to_pay_date
  - id: tone
    name: tone and empathy
    weight: 6.0
    check:
      question: Rate the agent's courtesy, patience and empathy (manner only, not
        procedure).
      scale: 5
  - id: language_match
    weight: 4.0
    check:
      question: Did the agent reply in the same language the customer spoke? Answering
        a Gujarati speaker in Hindi, or a Hindi speaker in English, is a fail; English
        loanwords inside the right language are fine. Judge language only.
- id: experience
  name: Caller experience (measured)
  parameters:
  - id: responsive
    name: answers within 2.5 s (p95)
    weight: 3.0
    check:
      type: metric
      metric: latency_p95_s <= 2.5
  - id: no_dead_air
    name: no dead air over 3 s
    weight: 3.0
    check:
      type: metric
      metric: dead_air_events == 0
  - id: no_talk_over
    name: never cuts the customer off
    weight: 3.0
    check:
      type: metric
      metric: agent_cut_off_caller == 0
dispositions:
- promise_to_pay
- topup_interest
- callback
- refused
- other
entities:
- promise_to_pay_date
language: en-IN
