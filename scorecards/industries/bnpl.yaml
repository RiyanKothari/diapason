# Generated by `bhool playbooks build` from playbooks/industries.yaml. The brand is fictional; the rules come
# from the industry's public regulations and norms.
name: Buy-now-pay-later reminders & disputes (Buy-now-pay-later)
agent:
  name: BaadMein Pay · bill-due reminders and dispute handling
  sop: 'Say the call is recorded, verify the user, remind of the bill and due date
    and the late fee accurately. If the user disputes a transaction, raise a dispute
    and give its reference instead of insisting on payment. Never ask for OTP.

    '
  required_disclosures:
  - the call is recorded
  disclosure_phrases:
  - recorded
  - record
  - रिकॉर्ड
  - रेकॉर्ड
  - રેકોર્ડ
  - ரெக்கார்டு
  - রেকর্ড
  - రికార్డ్
  - ರೆಕಾರ್ಡ್
  - റെക്കോർഡ്
  banned_phrases:
  - tell me the OTP
  - tell me the CVV
  banned_phrase_variants:
    tell me the OTP:
    - ओटीपी बताइए
    - OTP बताइए
    - ओटीपी बता दीजिए
    - OTP બતાવો
    - OTP சொல்லுங்கள்
    - OTP ಹೇಳಿ
    tell me the CVV:
    - CVV बताइए
    - सीवीवी बताइए
  must_collect:
  - promise_to_pay_date
  languages:
  - en-IN
  - hi-IN
sections:
- id: opening
  name: Opening
  parameters:
  - id: identifies_company
    weight: 4.0
    check:
      question: Did the agent name BaadMein Pay and the purpose of the call near the
        start?
  - id: recording_disclosure
    name: says the call is recorded
    weight: 5.0
    check:
      type: phrase_present
      phrases:
      - recorded
      - record
      - रिकॉर्ड
      - रेकॉर्ड
      - રેકોર્ડ
      - ரெக்கார்டு
      - রেকর্ড
      - రికార్డ్
      - ರೆಕಾರ್ಡ್
      - റെക്കോർഡ്
- id: verification
  name: Verification
  parameters:
  - id: verifies_first
    name: verifies identity before account details
    weight: 8.0
    fatal: true
    check:
      type: order
      first:
      - registered mobile
      - registered number
      - रजिस्टर्ड नंबर
      then:
      - rupees
      - due amount
      - रुपये
      - बकाया
- id: compliance
  name: Compliance (RBI Digital Lending Guidelines 2022)
  parameters:
  - id: banned_phrases
    name: 'never says: tell me the OTP, tell me the CVV'
    weight: 10.0
    fatal: true
    check:
      type: phrase_absent
      phrases:
      - tell me the OTP
      - tell me the CVV
  - id: no_contacts_threat
    weight: 10.0
    fatal: true
    check:
      question: Did the agent avoid threatening to call, message or shame the borrower
        before their phone contacts, friends, family or employer? Judge this only.
  - id: no_secret_request
    weight: 10.0
    fatal: true
    check:
      question: Did the agent avoid asking the customer to say an OTP, CVV, PIN, UPI
        PIN, password or full card number aloud, in any wording? Judge this only.
- id: outcome
  name: Outcome & conduct
  parameters:
  - id: gives_reference
    weight: 8.0
    check:
      question: Did the agent either resolve the issue on the call or give a complaint/ticket/reference
        number and when to expect resolution?
  - id: accurate_information
    weight: 8.0
    check:
      question: Was everything the agent stated about prices, timelines, policies
        and eligibility consistent with the SOP, with nothing invented?
  - id: confirms_ptp
    name: repeats the agreed date back
    weight: 6.0
    check:
      type: echo
  - id: captures_promise_to_pay_date
    weight: 5.0
    check:
      type: slot
      slot: promise_to_pay_date
  - id: tone
    name: tone and empathy
    weight: 6.0
    check:
      question: Rate the agent's courtesy, patience and empathy (manner only, not
        procedure).
      scale: 5
  - id: language_match
    weight: 4.0
    check:
      question: Did the agent reply in the same language the customer spoke? Answering
        a Gujarati speaker in Hindi, or a Hindi speaker in English, is a fail; English
        loanwords inside the right language are fine. Judge language only.
- id: experience
  name: Caller experience (measured)
  parameters:
  - id: responsive
    name: answers within 2.5 s (p95)
    weight: 3.0
    check:
      type: metric
      metric: latency_p95_s <= 2.5
  - id: no_dead_air
    name: no dead air over 3 s
    weight: 3.0
    check:
      type: metric
      metric: dead_air_events == 0
  - id: no_talk_over
    name: never cuts the customer off
    weight: 3.0
    check:
      type: metric
      metric: agent_cut_off_caller == 0
dispositions:
- promise_to_pay
- dispute_raised
- paid
- callback
- other
entities:
- promise_to_pay_date
language: en-IN
