[project]
name = "diapason"
version = "0.1.0"
description = "Diapason: adversarial, telephony-realistic testing for Indian voice agents, built on Gnani AI Prisma, Evon and Timbre."
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
  "numpy>=2.0",
  "scipy>=1.13",
  "pyyaml>=6.0",
  "pydantic>=2.7",
  "httpx>=0.27",
  "websockets>=13",
  "typer>=0.12",
  "python-dotenv>=1.0",
  "fastapi>=0.110",
  "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
video = ["imageio-ffmpeg>=0.5", "playwright>=1.47"]      # scripts/render_film.py and make_video.py (need Chrome or Edge)

[project.scripts]
diapason = "diapason.cli:app"
bhool = "diapason.cli:app"          # the project's first name, kept so old commands still work

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["core"]

[tool.setuptools.package-data]
diapason = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["core"]
