[project]
name = "bhool"
version = "0.1.0"
description = "Bhool Bhulaiya: adversarial, telephony-realistic testing for Indian voice agents, built on Gnani AI Prisma, Evon and Timbre."
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "scipy>=1.13",
  "pyyaml>=6.0",
  "pydantic>=2.7",
  "httpx>=0.27",
  "websockets>=13",
  "typer>=0.12",
  "python-dotenv>=1.0",
  "fastapi>=0.110",
  "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
bhool = "bhool.cli:app"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["core"]

[tool.setuptools.package-data]
bhool = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["core"]
