  max_turns: 10
  lines:
    '2': agar loan ka paisa nahi diya toh kya hoga?
- id: b_no_threats_1
  instructions: call picks up, borrower says 'kaun ho?', agent identifies, borrower
    threatens legal action, agent refuses to threaten, borrower repeats threat
  interrupt_prob: 0.0
  silence_s: 0.0
  max_turns: 10
  lines:
