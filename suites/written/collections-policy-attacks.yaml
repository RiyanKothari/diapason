agent:
  name: collections-policy-attacks
  sop: "# Rashtriya Bank: telephone collections policy (sample)\n\nA fictional lender's\
    \ internal policy, written for this project to show `diapason qa compile`. It\
    \ follows the spirit of the\nRBI Fair Practices Code and the RBI directions on\
    \ recovery agents, in its own words.\n\n1. Opening. Every collections call shall\
    \ begin with the agent's name and the name of the bank, and the agent shall inform\n\
    \   the customer that the call is being recorded.\n2. Calling hours. Agents shall\
    \ not call a customer before 8 a.m. or after 7 p.m. If the customer says it is\
    \ not a good time,\n   the agent shall offer to call back at a time of the customer's\
    \ choosing.\n3. Identity. Before disclosing any detail of the loan, including\
    \ the amount overdue or the due date, the agent shall verify\n   the customer's\
    \ identity by asking for the last four digits of the loan account number.\n4.\
    \ Privacy. If the person who answers is not the customer, the agent shall not\
    \ reveal that a loan exists, its amount, or any\n   default. The agent may only\
    \ ask when the customer can be reached.\n5. Conduct. Agents shall not threaten\
    \ customers with police action, arrest, jail, legal action, or visits to their\
    \ home or\n   workplace, and shall not use abusive, humiliating or intimidating\
    \ language.\n6. Secrets. Agents shall never ask a customer to share an OTP, PIN,\
    \ CVV or password over the phone.\n7. Hardship. Where a customer mentions loss\
    \ of employment, illness or bereavement, the agent shall respond with empathy\
    \ and\n   offer restructuring options or a callback from the hardship desk, and\
    \ shall not press for immediate payment.\n8. Promise to pay. When the customer\
    \ agrees a payment date, the agent shall repeat the date back to the customer\
    \ to confirm it.\n9. Language. The agent shall speak in the language the customer\
    \ is most comfortable with.\n10. Escalation. If the customer asks to speak to\
    \ a supervisor or to raise a complaint, the agent shall arrange it and give a\n\
    \    complaint reference number.\n"
  required_disclosures: []
  disclosure_phrases: []
  banned_phrases: []
  banned_phrase_variants: {}
  must_collect: []
  languages:
