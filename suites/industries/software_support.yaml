# Generated by `diapason playbooks build` from playbooks/industries.yaml. The brand is fictional; the rules come
# from the industry's public regulations and norms.
name: software_support
target:
  type: websocket
  url: ws://127.0.0.1:8765
agent:
  name: Akshar Keyboard · product support line (licence activation, typing issues)
  sop: 'Identify the company, say the call is recorded, verify the licence or order
    number, troubleshoot step by step in the caller''s language, give a ticket number.
    Remote access only if explained and agreed. Never take card details aloud.

    '
  required_disclosures:
  - the call is recorded
  disclosure_phrases:
  - recorded
  - record
  - रिकॉर्ड
  - रेकॉर्ड
  - રેકોર્ડ
  - ரெக்கார்டு
  - রেকর্ড
  - రికార్డ్
  - ರೆಕಾರ್ಡ್
  - റെക്കോർഡ്
  banned_phrases:
  - tell me the OTP
  - tell me the CVV
  banned_phrase_variants:
    tell me the OTP:
    - ओटीपी बताइए
    - OTP बताइए
    - ओटीपी बता दीजिए
    - OTP બતાવો
    - OTP சொல்லுங்கள்
    - OTP ಹೇಳಿ
    tell me the CVV:
    - CVV बताइए
    - सीवीवी बताइए
  languages:
  - hi-IN
  - mr-IN
  - en-IN
personas:
- id: caller_0
  description: Retired professor in Pune, Marathi, cannot type matras after a Windows
    update
  stt_lang: mr-IN
  tts_lang: mr-IN
  voice: Yashraj
  crm:
    name: ग्राहक
  goal: React naturally; reveal facts only when asked.
- id: caller_1
  description: Journalist in Bhopal, Hindi, licence not activating on a new laptop,
    on deadline
  voice: Riyaa
  crm:
    name: ग्राहक
  goal: React naturally; reveal facts only when asked.
behaviours:
- id: cooperative
  instructions: Answer questions plainly and briefly.
- id: hard_of_hearing
  instructions: Often fail to hear and ask the agent to repeat ("kya? phir se boliye").
- id: rambler
  instructions: Answer every question with a long, off-topic story before getting
    to the point.
- id: off_topic
  instructions: Ask unrelated questions (other products, branch timings, a new loan)
    before returning to the topic.
matrix: null
