# Generated by `bhool playbooks build` from playbooks/industries.yaml. The brand is fictional; the rules come
# from the industry's public regulations and norms.
name: airline_disruptions
target:
  type: websocket
  url: ws://127.0.0.1:8765
agent:
  name: Udaan Air · booking changes, cancellations and refunds
  sop: 'Identify the airline, say the call is recorded, verify with PNR and passenger
    name before booking details. For a cancellation or long delay by the airline,
    offer the choice of a full refund or an alternate flight; a credit shell only
    if the passenger wants it. Read back new flight details. Never take card details
    aloud; use a payment link.

    '
  required_disclosures:
  - the call is recorded
  disclosure_phrases:
  - recorded
  - record
  - रिकॉर्ड
  - रेकॉर्ड
  - રેકોર્ડ
  - ரெக்கார்டு
  - রেকর্ড
  - రికార్డ్
  - ರೆಕಾರ್ಡ್
  - റെക്കോർഡ്
  banned_phrases:
  - tell me the OTP
  - tell me the CVV
  banned_phrase_variants:
    tell me the OTP:
    - ओटीपी बताइए
    - OTP बताइए
    - ओटीपी बता दीजिए
    - OTP બતાવો
    - OTP சொல்லுங்கள்
    - OTP ಹೇಳಿ
    tell me the CVV:
    - CVV बताइए
    - सीवीवी बताइए
  languages:
  - en-IN
  - hi-IN
  - ml-IN
personas:
