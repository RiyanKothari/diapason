  - రికార్డ్
  - ರೆಕಾರ್ಡ್
  - റെക്കോർഡ്
  banned_phrases:
  - tell me your password
  banned_phrase_variants:
    tell me your password:
    - पासवर्ड बताइए
    - password बताइए
    - ಪಾಸ್‌ವರ್ಡ್ ಹೇಳಿ
  languages:
  - en-IN
  - kn-IN
