<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Diapason: the demo</title>
<meta name="description" content="The Diapason demo as a film that plays in the browser, every scene drawn from run files: a live call, planted bugs, Guard, the version matrix, the phone-line atlas, noise and QA.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=Noto+Sans+Devanagari:wght@400;600&family=Noto+Sans+Gujarati:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f7f7f5;--fg:#0e0e0e;--muted:#6b6b6b;--line:rgba(0,0,0,.1);
  /* the stage is a screen: it stays dark in both themes, like a video player */
  --s-bg:#0a0b0d;--s-card:#14161a;--s-soft:#1d2026;--s-fg:#f4f4f2;--s-text:#d4d6da;--s-muted:#8b9099;--s-line:rgba(255,255,255,.09);
  --pass:#4ade80;--fail:#fb7a45;--warn:#facc15;--accent:#8ea2ff;--guard:#2dd4bf;
  --serif:"Instrument Serif",Georgia,serif;--sans:Inter,"Noto Sans Devanagari","Noto Sans Gujarati","Nirmala UI",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#050506;--fg:#f5f5f4;--muted:#8f8f8b;--line:rgba(255,255,255,.1)}}
:root[data-theme="dark"]{--bg:#050506;--fg:#f5f5f4;--muted:#8f8f8b;--line:rgba(255,255,255,.1)}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--sans);display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
.top{display:flex;align-items:center;gap:14px;padding:12px 16px;font-size:14px}
.top a{color:var(--muted);text-decoration:none}.top a:hover{color:var(--fg)}.top b{font-weight:600}.top .sp{flex:1}
.viewport{flex:1;display:flex;align-items:center;justify-content:center;padding:0 16px;min-height:0}
.frame{position:relative;width:100%;max-width:calc((100vh - 150px) * 16 / 9);aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:var(--s-bg);box-shadow:0 30px 80px rgba(0,0,0,.35)}
#stage{position:absolute;left:0;top:0;width:1600px;height:900px;transform-origin:0 0;color:var(--s-text);overflow:hidden}
.scene{position:absolute;inset:0;padding:64px 80px 120px;opacity:0;transition:opacity .45s}
.scene.on{opacity:1}
.kicker{font:600 15px var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.title{font:400 64px/1.02 var(--serif);color:var(--s-fg);margin:12px 0 0;letter-spacing:-.01em}
.source{position:absolute;right:28px;top:22px;font:500 12px var(--sans);color:var(--s-muted);opacity:.8}
.cap{position:absolute;left:0;right:0;bottom:30px;display:flex;justify-content:center;pointer-events:none;z-index:4}
.cap span{max-width:1180px;background:rgba(0,0,0,.72);color:#fff;font:500 25px/1.35 var(--sans);padding:10px 22px;border-radius:12px;text-align:center;transition:opacity .3s}
.cap span:empty{opacity:0}
.fade{opacity:0;transform:translateY(14px);transition:opacity .5s,transform .5s}
.fade.in{opacity:1;transform:none}
/* intro */
.intro h1{font:400 92px/1 var(--serif);color:var(--s-fg);margin:70px 0 0;letter-spacing:-.02em}
.intro h1 + h1{color:var(--s-muted);font-style:italic;margin-top:8px}
.cast{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:56px}
.who{background:var(--s-card);border:1px solid var(--s-line);border-radius:16px;padding:16px 20px}
.who b{font:600 26px var(--sans);color:var(--s-fg)}
.who .d{color:var(--s-muted);font-size:15px;margin-top:2px}
.who .tag{display:inline-block;margin-top:10px;font:600 12px var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--warn);border:1px solid color-mix(in srgb,var(--warn) 50%,transparent);border-radius:999px;padding:2px 10px}
/* call */
.call{display:grid;grid-template-columns:1fr 430px;gap:28px;margin-top:22px;height:610px}
.panel{background:var(--s-card);border:1px solid var(--s-line);border-radius:18px;display:flex;flex-direction:column;overflow:hidden}
.panel h4{margin:0;padding:14px 18px;border-bottom:1px solid var(--s-line);font:600 13px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--s-muted);display:flex;gap:10px;align-items:center}
.rec{width:10px;height:10px;border-radius:50%;background:var(--fail);animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.25}}
.wave{display:flex;align-items:center;gap:2px;height:54px;padding:6px 18px}
.wave i{flex:1;border-radius:2px;background:var(--s-soft);min-height:2px}
.wave i.on{background:var(--accent)}
.feed{flex:1;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;gap:12px;padding:12px 18px 18px}
.bub{max-width:86%;padding:12px 16px;border-radius:18px;font-size:22px;line-height:1.45;color:var(--s-fg);display:none}
.bub.show{display:block;animation:pop .35s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(10px)}}
.bub.agent{align-self:flex-start;background:var(--s-soft);border-bottom-left-radius:5px}
.bub.caller{align-self:flex-end;background:color-mix(in srgb,var(--accent) 22%,var(--s-card));border-bottom-right-radius:5px}
.bub .w{display:block;font:600 12px var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--s-muted);margin-bottom:2px}
.bub mark{background:none;color:var(--s-fg);border-radius:4px;transition:background .3s,color .3s}
.bub.flagged mark{background:var(--fail);color:#111;padding:0 4px}
.stamp{display:inline-block;margin:8px 8px 0 0;font:700 13px var(--sans);letter-spacing:.05em;text-transform:uppercase;color:#111;background:var(--fail);border-radius:7px;padding:3px 9px;opacity:0;transform:scale(1.8) rotate(-5deg);transition:transform .3s cubic-bezier(.2,1.6,.4,1),opacity .2s}
.bub.flagged .stamp{opacity:1;transform:none}
.lat{display:inline-block;margin-left:8px;font:600 12px var(--sans);color:var(--s-muted)}
.lat.slow{color:var(--warn)}
.checks{padding:12px 18px;display:flex;flex-direction:column;gap:10px;flex:1}
.chk{display:flex;gap:12px;align-items:flex-start;font-size:18px;color:var(--s-fg);opacity:0;transform:translateX(16px);transition:opacity .35s,transform .35s}
.chk.in{opacity:1;transform:none}
.chk .x{flex:none;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font-weight:700;color:#111;background:var(--fail)}
.chk small{display:block;color:var(--s-muted);font-size:14px}
.lats{display:flex;gap:8px;flex-wrap:wrap;padding:0 18px 12px}
.verdict{margin:0 18px 18px;padding:16px 18px;border-radius:14px;background:color-mix(in srgb,var(--fail) 18%,var(--s-card));border:1px solid color-mix(in srgb,var(--fail) 55%,transparent);opacity:0;transition:opacity .5s}
.verdict.in{opacity:1}
.verdict b{display:block;font:700 26px var(--sans);color:var(--fail)}
.verdict div{font-size:15px;color:var(--s-text)}
/* bugs */
.big{font:400 160px/1 var(--serif);color:var(--s-fg);letter-spacing:-.03em}
.big small{font:500 24px var(--sans);letter-spacing:0;color:var(--s-muted);margin-left:14px}
.bugs{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:30px}
.bug{background:var(--s-card);border:1px solid var(--s-line);border-radius:16px;padding:16px 18px;min-height:130px;position:relative;font-size:18px;color:var(--s-fg);transition:border-color .3s,background .3s}
.bug .id{font:600 12px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--s-muted)}
.bug.hit{border-color:color-mix(in srgb,var(--pass) 60%,transparent);background:color-mix(in srgb,var(--pass) 8%,var(--s-card))}
.bug .ok{position:absolute;right:14px;bottom:12px;font:700 13px var(--sans);letter-spacing:.06em;color:#0b0b0b;background:var(--pass);border-radius:7px;padding:3px 9px;opacity:0;transform:scale(1.8) rotate(-6deg);transition:all .3s cubic-bezier(.2,1.6,.4,1)}
.bug.hit .ok{opacity:1;transform:none}
.row{display:flex;gap:40px;align-items:flex-end}
.note{color:var(--s-muted);font-size:18px;max-width:720px}
/* guard */
.gwrap{display:grid;grid-template-columns:1fr 400px;gap:30px;margin-top:26px}
.rw{background:var(--s-card);border:1px solid var(--s-line);border-radius:16px;padding:14px 18px;margin-bottom:12px}
.rw .rule{font:600 12px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--guard)}
.rw .before{font-size:20px;color:var(--s-fg);margin-top:4px;transition:color .4s}
.rw .before s{text-decoration-thickness:3px;text-decoration-color:transparent;transition:text-decoration-color .4s}
.rw.done .before{color:var(--s-muted)}.rw.done .before s{text-decoration-color:var(--fail)}
.rw .after{font-size:20px;color:var(--guard);border-left:3px solid var(--guard);padding-left:12px;margin-top:8px;opacity:0;transition:opacity .4s}
.rw.done .after{opacity:1}
.score{background:var(--s-card);border:1px solid var(--s-line);border-radius:18px;padding:22px}
.score .big{font-size:120px}
.st{display:flex;justify-content:space-between;padding:8px 0;border-top:1px solid var(--s-line);font-size:17px;color:var(--s-fg)}
.st i{font-style:normal;font-weight:600}.st .p{color:var(--guard)}.st .f{color:var(--fail)}
/* matrix */
table.m{border-collapse:separate;border-spacing:8px;margin-top:22px;width:100%;table-layout:fixed}
.m col.first{width:38%}
.m th{font:600 15px var(--sans);color:var(--s-muted);text-align:center;padding:6px}
.m th:first-child{text-align:left}
.m td{background:var(--s-card);border-radius:12px;height:60px;text-align:center;font:700 22px var(--sans);color:var(--s-muted)}
.m td:first-child{text-align:left;padding:0 18px;font:500 18px var(--sans);color:var(--s-fg);background:none}
.m td.c{opacity:.15;transition:opacity .35s,background .35s}
.m td.c.in{opacity:1}
.m td.prevented{background:color-mix(in srgb,var(--guard) 22%,var(--s-card));color:var(--guard)}
.m td.flagged{background:color-mix(in srgb,var(--fail) 18%,var(--s-card));color:var(--fail)}
.m tr.tot td{background:none;font:600 18px var(--sans);color:var(--s-fg);height:40px}
.m th.hl{color:var(--guard)}
/* atlas */
.heat{display:grid;gap:5px;margin-top:20px}
.heat .h{font:600 14px var(--sans);color:var(--s-muted);text-align:center;align-self:end}
.heat .l{font:500 16px var(--sans);color:var(--s-fg);align-self:center}
.heat .v{height:34px;border-radius:7px;background:var(--s-soft);display:grid;place-items:center;font:600 13px var(--sans);color:transparent;transition:background .4s,color .4s}
.heat .v.in{color:#0b0b0b}
.side{display:flex;flex-direction:column;gap:14px}
.fact{background:var(--s-card);border:1px solid var(--s-line);border-radius:16px;padding:16px 18px;font-size:17px;color:var(--s-fg)}
.fact b{display:block;font:400 48px/1 var(--serif);color:var(--s-fg);margin-bottom:4px}
.fact.warn{border-color:color-mix(in srgb,var(--warn) 50%,transparent)}
/* stress */
.grids{display:grid;grid-template-columns:1fr 1fr;gap:34px;margin-top:30px}
.grid h3{margin:0 0 10px;font:600 22px var(--sans);color:var(--s-fg)}
.g{display:grid;grid-template-columns:120px repeat(6,1fr);gap:6px}
.g .h{font:600 14px var(--sans);color:var(--s-muted);text-align:center}
.g .l{font:500 17px var(--sans);color:var(--s-fg);align-self:center}
.g .v{height:52px;border-radius:10px;background:var(--s-soft);display:grid;place-items:center;font:700 20px var(--sans);color:transparent;transition:all .35s}
.g .v.ok{background:color-mix(in srgb,var(--pass) 22%,var(--s-card));color:var(--pass)}
.g .v.no{background:color-mix(in srgb,var(--fail) 20%,var(--s-card));color:var(--fail)}
/* qa */
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;margin-top:34px}
.kpi{background:var(--s-card);border:1px solid var(--s-line);border-radius:18px;padding:22px 26px}
.kpi b{display:block;font:400 92px/1 var(--serif);color:var(--s-fg)}
.kpi span{font-size:19px;color:var(--s-muted)}
/* outro */
.outro{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding-bottom:140px}
.outro h1{font:400 140px/1 var(--serif);color:var(--s-fg);margin:0;letter-spacing:-.03em}
.outro .tl{font-size:24px;color:var(--s-muted);margin-top:14px}
.models{display:flex;gap:18px;margin-top:46px}
.model{background:var(--s-card);border:1px solid var(--s-line);border-radius:18px;padding:18px 26px;min-width:280px}
.model b{display:block;font:600 30px var(--sans);color:var(--s-fg)}.model span{color:var(--s-muted);font-size:16px}
/* start screen and controls */
.start{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:radial-gradient(60% 60% at 50% 40%,#1a1d26,#07080a);cursor:pointer;z-index:6;color:#fff;text-align:center;padding:16px}
.start .pb{width:96px;height:96px;border-radius:50%;background:#fff;display:grid;place-items:center;transition:transform .2s}
.start:hover .pb{transform:scale(1.06)}
.start .pb:after{content:"";border-left:30px solid #111;border-top:18px solid transparent;border-bottom:18px solid transparent;margin-left:8px}
.start h2{font:400 clamp(28px,4vw,54px)/1 var(--serif);margin:0}
.start p{margin:0;color:#a9adb5;font-size:clamp(13px,1.6vw,17px);max-width:640px}
.ctl{display:flex;align-items:center;gap:12px;padding:12px 16px 16px;max-width:calc((100vh - 150px) * 16 / 9 + 32px);width:100%;margin:0 auto}
.ctl button{background:none;border:1px solid var(--line);color:var(--fg);border-radius:999px;height:34px;min-width:34px;padding:0 12px;font:500 13px var(--sans);cursor:pointer}
.ctl button:hover{border-color:var(--muted)}
.bar{flex:1;display:flex;gap:3px;height:34px;align-items:center;cursor:pointer}
.chap{position:relative;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.chap i{position:absolute;inset:0;width:0;background:var(--fg)}
.chap:hover{height:10px}
.time{font:500 13px var(--sans);color:var(--muted);font-variant-numeric:tabular-nums;min-width:86px;text-align:right}
.chname{font:500 13px var(--sans);color:var(--muted);min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px}
body.record .top,body.record .ctl{display:none}
body.record .viewport{padding:0}body.record .frame{border-radius:0;max-width:calc(100vh * 16 / 9);box-shadow:none}
.subt{color:var(--muted)}
@media (max-width:700px){.chname,.subt{display:none}.ctl{flex-wrap:wrap}}
</style>
</head>
<body>
<div class="top"><b>Diapason</b><span class="subt">the demo, played from the run files</span><span class="sp"></span><a href="index.html">Home</a><a href="studio.html">QA Studio</a><a href="proof/proof.html">Proof</a></div>
<div class="viewport"><div class="frame" id="frame">
  <div id="stage"></div>
  <div class="start" id="start"><div class="pb"></div><h2>Watch Diapason work</h2><p id="startNote"></p></div>
</div></div>
<div class="ctl">
  <button id="play" aria-label="Play or pause">Play</button>
  <button id="prev" aria-label="Previous scene">‹</button><button id="next" aria-label="Next scene">›</button>
  <span class="chname" id="chname"></span>
  <div class="bar" id="bar"></div>
  <span class="time" id="time">0:00</span>
  <button id="mute" aria-label="Sound">Sound on</button>
  <button id="rec" title="Hide the controls for screen recording (R)">Record</button>
  <button id="fs" aria-label="Full screen">⤢</button>
</div>
<audio id="audio" preload="auto"></audio>
<script>
const FILM = __DATA__;
const S = FILM.scenes, stage = document.getElementById("stage"), audio = document.getElementById("audio");
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const pct = x => x == null ? "–" : `${(100 * x).toFixed(x >= .995 || x === 0 ? 0 : 1)}%`;
const fmt = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;
const starts = []; let acc = 0; for (const s of S) { starts.push(acc); acc += s.dur; }
const TOTAL = acc;
const NAMES = {intro: "The callers", call: "A live call", bugs: "Planted bugs", guard: "Guard", versions: "v1 → v4",
               atlas: "Phone-line atlas", stress: "Noise", qa: "QA", outro: "Built on Gnani"};

/* each renderer builds its DOM once and returns tick(t): the scene's state is a pure function of its local time,
   so scrubbing to any moment draws exactly what playing to it would */
const R = {
  intro(el, s) {
    el.classList.add("intro");
    el.innerHTML = `<div class="kicker fade">Crash tests for Indian voice agents</div><h1 class="fade">${esc(s.title)}</h1><h1 class="fade">${esc(s.title2)}</h1>
      <div class="cast">${s.cast.map(c => `<div class="who fade"><b>${esc(c.name)}</b><div class="d">${esc(c.who.replace(/_/g, " "))} · ${esc(c.does)} · ${esc(c.line)}</div><span class="tag">${esc(c.id.replace(/_/g, " "))}</span></div>`).join("")}</div>`;
    const f = [...el.querySelectorAll(".fade")];
    return t => f.forEach((x, i) => x.classList.toggle("in", t >= (i < 3 ? i * .5 : 2.2 + (i - 3) * .35)));
  },
  call(el, s) {
    const mark = (text, flags) => {
      let h = esc(text);
      for (const f of flags) if (f.quote && f.quote.length < text.length) h = h.split(esc(f.quote)).join(`<mark>${esc(f.quote)}</mark>`);
      return h;
    };
    let li = 0;
    el.innerHTML = `<div class="kicker">${esc(s.kicker)}</div><div class="title">${esc(s.title)}</div>
      <div class="call"><div class="panel"><h4><span class="rec"></span>On the line · ${esc(s.turns.length)} turns · ${s.length.toFixed(0)} s</h4>
        <div class="wave">${s.peaks.map(p => `<i style="height:${Math.max(4, p * 100)}%"></i>`).join("")}</div>
        <div class="feed">${s.turns.map(t => `<div class="bub ${t.who}"><span class="w">${t.who === "agent" ? "Agent v1" : "Ramesh (synthetic caller)"}${t.latency != null ? `<span class="lat ${t.latency > 2.5 ? "slow" : ""}">replied in ${t.latency.toFixed(2)} s</span>` : ""}</span>${mark(t.text, t.flags)}${[...new Set(t.flags.map(f => f.name))].map(n => `<span class="stamp">${esc(n)}</span>`).join("")}</div>`).join("")}</div></div>
      <div class="panel"><h4>Diapason's checks</h4><div class="checks">${s.fails.map(f => `<div class="chk"><span class="x">✕</span><div>${esc(f.name)}<small>${esc(f.why)}</small></div></div>`).join("")}
        ${s.metric_failures.map(m => `<div class="chk mf"><span class="x">✕</span><div>latency<small>${esc(m)}</small></div></div>`).join("")}</div>
        <div class="verdict"><b>Fails the launch gate</b><div>${s.gate.map(esc).join(" · ")}</div></div></div></div>`;
    const bubs = [...el.querySelectorAll(".bub")], bars = [...el.querySelectorAll(".wave i")];
    const chks = [...el.querySelectorAll(".chk")], verdict = el.querySelector(".verdict");
    return t => {
      const ct = t * s.rate;
      s.turns.forEach((x, i) => { bubs[i].classList.toggle("show", ct >= x.start); bubs[i].classList.toggle("flagged", ct >= x.start + 1.2 && x.flags.length > 0); });
      const on = Math.floor(Math.min(1, ct / s.length) * bars.length);
      if (on !== li) { bars.forEach((b, i) => b.classList.toggle("on", i < on)); li = on; }
      chks.forEach((c, i) => {
        const f = s.fails[i], at = f ? (f.at != null ? s.turns[f.at].start + 1.2 : s.length) : s.length + .6;
        c.classList.toggle("in", ct >= at);
      });
      verdict.classList.toggle("in", ct >= s.length + 1.2);
    };
  },
  bugs(el, s) {
    el.innerHTML = `<div class="kicker">${esc(s.kicker)}</div><div class="title">${esc(s.title)}</div>
      <div class="bugs">${s.bugs.map(b => `<div class="bug"><div class="id">${esc(b.id.replace(/_/g, " "))}</div>${esc(b.what)}<span class="ok">caught</span></div>`).join("")}</div>
      <div class="row" style="margin-top:26px"><div class="big"><span id="n">0</span><small> / ${s.measured} tests catch their bug</small></div></div>`;
    const tiles = [...el.querySelectorAll(".bug")], n = el.querySelector("#n");
    return t => { let c = 0; tiles.forEach((x, i) => { const on = s.bugs[i].caught && t >= 1 + i * .55; x.classList.toggle("hit", on); c += on; }); n.textContent = c; };
  },
  guard(el, s) {
    el.innerHTML = `<div class="kicker">${esc(s.kicker)}</div><div class="title">${esc(s.title)}</div>
      <div class="gwrap"><div>${s.rewrites.map(r => `<div class="rw fade"><div class="rule">${esc(r.rule.replace(/_/g, " "))} · ${esc(r.action)}</div>
        <div class="before"><s>${esc(r.before)}</s></div><div class="after">${r.after ? esc(r.after) : "dropped: never spoken"}</div></div>`).join("")}</div>
        <div class="score"><div class="big">${s.prevented}<small>/ ${s.measured}</small></div>
        <div style="color:var(--s-muted);font-size:17px;margin:-6px 0 12px">text bugs prevented on the unfixed agent</div>
        ${s.bugs.map(b => `<div class="st fade"><span>${esc(b.id)}</span><i class="${b.status === "prevented" ? "p" : "f"}">${esc(b.status)}</i></div>`).join("")}</div></div>`;
    const rws = [...el.querySelectorAll(".rw")], sts = [...el.querySelectorAll(".st")];
    return t => { rws.forEach((r, i) => { r.classList.toggle("in", t >= .5 + i * 2.6); r.classList.toggle("done", t >= 1.7 + i * 2.6); });
                  sts.forEach((x, i) => x.classList.toggle("in", t >= 9 + i * .4)); };
  },
  versions(el, s) {
    const icon = st => st === "prevented" ? ["prevented", "✓"] : st.startsWith("still") ? ["flagged", "✕"] : ["", "·"];
    el.innerHTML = `<div class="kicker">${esc(s.kicker)}</div><div class="title">${esc(s.title)}</div>
      <table class="m"><colgroup><col class="first">${s.cols.map(() => "<col>").join("")}</colgroup><tr><th>Bug planted in v1</th>${s.cols.map((c, i) => `<th class="${i === s.cols.length - 1 ? "hl" : ""}">${esc(c.label)}</th>`).join("")}</tr>
      ${s.rows.map((r, j) => `<tr><td>${esc(r.what)}</td>${s.cols.map(c => { const [k, g] = icon(c.cells[j]); return `<td class="c ${k}">${g}</td>`; }).join("")}</tr>`).join("")}
      <tr class="tot"><td>text bugs prevented</td>${s.cols.map(c => `<td class="c">${c.prevented}/${c.measured}</td>`).join("")}</tr>
      <tr class="tot"><td>proof calls passing every check</td>${s.cols.map(c => `<td class="c">${c.calls ? c.calls.join("/") : "–"}</td>`).join("")}</tr></table>`;
    const cols = s.cols.map((_, i) => [...el.querySelectorAll(`tr td.c:nth-child(${i + 2})`)]);
    return t => cols.forEach((cells, i) => cells.forEach(c => c.classList.toggle("in", t >= .8 + i * 1.6)));
  },
  atlas(el, s) {
    const col = v => v >= s.target ? `color-mix(in srgb,var(--pass) ${55 + 45 * v}%,#0b0b0b)` : v >= .85 ? "var(--warn)" : "var(--fail)";
    el.innerHTML = `<div class="kicker">${esc(s.kicker)}</div><div class="title">${esc(s.title)}</div>
      <div style="display:grid;grid-template-columns:1fr 360px;gap:30px">
      <div class="heat" style="grid-template-columns:200px repeat(${s.snrs.length},1fr)"><div></div>${s.snrs.map(x => `<div class="h">${x} dB</div>`).join("")}
        ${s.rows.map(r => `<div class="l">${esc(r.label)}</div>${r.cells.map((v, i) => `<div class="v" data-i="${i}" data-c="${col(v)}">${pct(v)}</div>`).join("")}`).join("")}</div>
      <div class="side"><div class="fact"><b>${s.requests.toLocaleString("en-IN")}</b>Timbre → phone line → Prisma requests, ${s.minutes} minutes of audio, 0 errors</div>
        ${s.read_back.map(r => `<div class="fact warn fade"><b>&lt; ${r.below} dB</b>${esc(r.what)}: read it back below this (${pct(r.at["5"])} at 5 dB, ${pct(r.at["0"])} at 0 dB)</div>`).join("")}
        <div class="fact fade" style="font-size:15px;color:var(--s-muted)">Each cell averages 3–5 ways of writing the detail. Green: survives at least ${pct(s.target)} of the time.</div></div></div>`;
    const cells = [...el.querySelectorAll(".heat .v")], fades = [...el.querySelectorAll(".fade")];
    return t => { cells.forEach(c => { const on = t >= .6 + c.dataset.i * .9; c.classList.toggle("in", on); c.style.background = on ? c.dataset.c : ""; });
                  fades.forEach((f, i) => f.classList.toggle("in", t >= 6 + i * .7)); };
  },
  stress(el, s) {
    const grid = (v, g) => `<div class="grid"><h3>Agent ${esc(v)}</h3><div class="g"><div></div>${s.levels.map(l => `<div class="h">${l} dB</div>`).join("")}
      ${s.noises.map(n => `<div class="l">${esc(n)}</div>${s.levels.map((l, i) => `<div class="v" data-i="${i}" data-ok="${g[n][String(l)] ? 1 : 0}">${g[n][String(l)] ? "✓" : "✕"}</div>`).join("")}`).join("")}</div></div>`;
    el.innerHTML = `<div class="kicker">${esc(s.kicker)}</div><div class="title">${esc(s.title)}</div>
      <div class="grids">${Object.entries(s.versions).map(([v, g]) => grid(v, g)).join("")}</div>`;
    const cells = [...el.querySelectorAll(".g .v")];
    return t => cells.forEach(c => { const on = t >= .6 + c.dataset.i * .7; c.classList.toggle("ok", on && c.dataset.ok === "1"); c.classList.toggle("no", on && c.dataset.ok === "0"); });
  },
  qa(el, s) {
    const k = [[s.accuracy, v => `${(100 * v).toFixed(1)}%`, `of ${s.n} QA verdicts right, on calls the judge never saw`],
               [s.fatal_recall, v => `${Math.round(100 * v)}%`, "of fatal compliance breaches caught"],
               [s.fatal_false_alarms, v => `${Math.round(v)}`, "false fatal alarms"],
               [s.industries, v => `${Math.round(v)}`, "industry playbooks, each with its regulator's rules"]];
    el.innerHTML = `<div class="kicker">${esc(s.kicker)}</div><div class="title">${esc(s.title)}</div>
      <div class="kpis">${k.map(x => `<div class="kpi fade"><b>–</b><span>${esc(x[2])}</span></div>`).join("")}</div>`;
    const els = [...el.querySelectorAll(".kpi")];
    return t => els.forEach((e, i) => { const a = Math.max(0, Math.min(1, (t - .4 - i * .5) / 1.6)); e.classList.toggle("in", a > 0);
      const v = k[i][0]; e.querySelector("b").textContent = v == null ? "–" : k[i][1](v * (1 - Math.pow(1 - a, 3))); });
  },
  outro(el, s) {
    el.classList.add("outro");
    el.innerHTML = `<h1 class="fade">${esc(s.title)}</h1><div class="tl fade">Crash tests before launch · a guard during the call · QA after it</div>
      <div class="models">${s.models.map(m => `<div class="model fade"><b>Gnani ${esc(m.name)}</b><span>${esc(m.role)}</span></div>`).join("")}</div>
      <div class="tl fade" style="font-size:16px;margin-top:40px">${esc(FILM.note)}</div>`;
    const f = [...el.querySelectorAll(".fade")];
    return t => f.forEach((x, i) => x.classList.toggle("in", t >= i * .45));
  },
};

const scenes = S.map(s => {
  const el = document.createElement("div");
  el.className = "scene";
  const tick = R[s.type](el, s);
  if (s.source) el.insertAdjacentHTML("beforeend", `<div class="source">from ${esc(s.source)}</div>`);
  stage.appendChild(el);
  return {el, tick};
});
const cap = document.createElement("div"); cap.className = "cap"; cap.innerHTML = "<span></span>"; stage.appendChild(cap);

/* controls */
const bar = document.getElementById("bar");
S.forEach((s, i) => { const c = document.createElement("div"); c.className = "chap"; c.style.flex = s.dur; c.title = NAMES[s.type] || s.type;
  c.innerHTML = "<i></i>"; c.onclick = e => { const r = c.getBoundingClientRect(); seek(starts[i] + s.dur * (e.clientX - r.left) / r.width); }; bar.appendChild(c); });
const fills = [...bar.querySelectorAll(".chap i")];
let T = 0, playing = false, last = 0, cur = -1, muted = false;
const params = new URLSearchParams(location.search);
document.getElementById("startNote").textContent = `${fmt(TOTAL)} · ${S.length} scenes · sound on: the call scene plays the real recording. ${FILM.note}`;

function sceneAt(t) { let i = 0; while (i < S.length - 1 && t >= starts[i + 1]) i++; return i; }
function syncAudio(i, lt) {
  const s = S[i];
  if (s.type !== "call") { if (!audio.paused) audio.pause(); return; }
  if (!audio.src.endsWith(s.audio)) audio.src = s.audio;
  const want = lt * s.rate;
  audio.playbackRate = s.rate; audio.muted = muted;
  if (want >= s.length) { if (!audio.paused) audio.pause(); return; }
  if (Math.abs(audio.currentTime - want) > .35) audio.currentTime = want;
  if (playing && audio.paused) audio.play().catch(() => {});
  if (!playing && !audio.paused) audio.pause();
}
function draw() {
  const i = sceneAt(T), lt = T - starts[i];
  if (i !== cur) { scenes.forEach((x, j) => x.el.classList.toggle("on", j === i)); cur = i; document.getElementById("chname").textContent = `${i + 1}/${S.length} · ${NAMES[S[i].type] || ""}`; }
  scenes[i].tick(lt);
  const caps = S[i].captions || []; let c = ""; for (const [at, text] of caps) if (lt >= at) c = text;
  const span = cap.firstChild; if (span.textContent !== c) span.textContent = c;
  fills.forEach((f, j) => f.style.width = `${Math.max(0, Math.min(1, (T - starts[j]) / S[j].dur)) * 100}%`);
  document.getElementById("time").textContent = `${fmt(T)} / ${fmt(TOTAL)}`;
  syncAudio(i, lt);
}
/* wall-clock time, not frames: a slow or throttled machine skips frames but never plays in slow motion. While the
   call's audio plays it is the clock, so words and transcript cannot drift apart. */
function step() {
  const now = performance.now();
  if (playing) {
    const s = S[sceneAt(T)];
    if (s.type === "call" && !audio.paused && !audio.seeking && audio.currentTime < s.length) T = starts[sceneAt(T)] + audio.currentTime / s.rate;
    else T += Math.min(1, (now - last) / 1000);
    if (T >= TOTAL) { T = TOTAL - .001; setPlaying(false); }
  }
  last = now; draw();
}
function loop() { step(); requestAnimationFrame(loop); }
setInterval(() => { if (performance.now() - last > 240) step(); }, 250);
function setPlaying(p) { playing = p; last = performance.now(); document.getElementById("play").textContent = p ? "Pause" : "Play"; if (!p) audio.pause(); }
function seek(t) { T = Math.max(0, Math.min(TOTAL - .001, t)); draw(); }
function start() { document.getElementById("start").remove(); if (T >= TOTAL - .01) T = 0; setPlaying(true); }
document.getElementById("start").onclick = start;
document.getElementById("play").onclick = () => document.getElementById("start") ? start() : setPlaying(!playing);
document.getElementById("prev").onclick = () => { const i = sceneAt(T); seek(T - starts[i] > 1.5 ? starts[i] : starts[Math.max(0, i - 1)]); };
document.getElementById("next").onclick = () => seek(starts[Math.min(S.length - 1, sceneAt(T) + 1)]);
document.getElementById("mute").onclick = e => { muted = !muted; audio.muted = muted; e.target.textContent = muted ? "Sound off" : "Sound on"; };
const toggleRec = () => { document.body.classList.toggle("record"); fit(); };
document.getElementById("rec").onclick = toggleRec;
document.getElementById("fs").onclick = () => document.fullscreenElement ? document.exitFullscreen() : document.getElementById("frame").requestFullscreen();
addEventListener("keydown", e => {
  if (e.key === " ") { e.preventDefault(); document.getElementById("play").click(); }
  else if (e.key === "ArrowRight") document.getElementById("next").click();
  else if (e.key === "ArrowLeft") document.getElementById("prev").click();
  else if (e.key === "r" || e.key === "R") toggleRec();
  else if (e.key === "m" || e.key === "M") document.getElementById("mute").click();
});
function fit() { const f = document.getElementById("frame"); stage.style.transform = `scale(${f.clientWidth / 1600})`; }
addEventListener("resize", fit); new ResizeObserver(fit).observe(document.getElementById("frame"));
if (params.has("record")) document.body.classList.add("record");
if (params.has("t")) seek(+params.get("t"));
if (params.has("scene")) seek(starts[Math.max(0, S.findIndex(s => s.type === params.get("scene")))] + (+params.get("at") || 0));
fit(); draw(); last = performance.now(); requestAnimationFrame(loop);
</script>
</body>
</html>
